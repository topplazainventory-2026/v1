<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Top Plaza Stock Management System</title>
  <script>
    // STEP 1: Replace this placeholder with your deployed Google Apps Script
    // Web App URL ending in /exec.
    const APPS_SCRIPT_WEB_APP_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

    // Redirect only after a real URL has been entered.
    if (APPS_SCRIPT_WEB_APP_URL.startsWith("https://script.google.com/macros/s/")
        && APPS_SCRIPT_WEB_APP_URL.endsWith("/exec")) {
      window.location.replace(APPS_SCRIPT_WEB_APP_URL);
    }
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f4f7fb;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    main {
      width: min(560px, 100%);
      padding: 32px;
      box-sizing: border-box;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,.10);
    }
    h1 { margin-top: 0; color: #17365d; }
    p { line-height: 1.6; }
    code {
      display: block;
      margin-top: 16px;
      padding: 12px;
      overflow-wrap: anywhere;
      background: #f1f5f9;
      border-radius: 8px;
      text-align: left;
    }
  </style>
</head>
<body>
  <main>
    <h1>Top Plaza Stock Management System</h1>
    <p id="message">
      The GitHub redirect page is ready, but the Google Apps Script Web App URL
      has not been entered yet.
    </p>
    <p>Open <strong>index.html</strong> in your GitHub repository and replace
      <code>PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE</code> with your deployed
      Apps Script URL ending in <code>/exec</code>.</p>
  </main>
</body>
</html>
